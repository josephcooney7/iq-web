<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IQ Gate Screen</title>
<meta name="description" content="Full-screen OpenGate alarm screen for a tablet at the checkpoint.">
<meta name="theme-color" content="#0e161d">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IQ Gate">
<link rel="stylesheet" href="/css/common.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Always dark: it sits on a tablet at the gate. */
body { background: #0e161d; color: #e9eef2; }
.gs { min-height: calc(100dvh - 56px); display: flex; flex-direction: column; }
.gs-head { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #273642; }
.gs-head select { min-height: 44px; font: inherit; font-size: 16px; background: #15202a; color: #e9eef2; border: 1px solid #273642; border-radius: 10px; padding: 0 10px; max-width: 100%; }
.gs-status { display: flex; align-items: center; gap: 8px; color: #aebbc6; font-size: 15px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: #7f8e9a; flex: none; }
.dot.ok { background: #5cc283; } .dot.bad { background: #f08a80; }
.gs-main { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 14px; padding: 28px 16px; text-align: center; }
.gs-main.alarm { background: #7d1a14; animation: pulse 1s ease-in-out 6; }
@keyframes pulse { 50% { background: #a3241c; } }
.big { font-family: var(--f-display); font-weight: 700; line-height: 1; }
.clear .big { font-size: clamp(48px, 12vw, 88px); color: #5cc283; }
.alarm .big { font-size: clamp(64px, 18vw, 120px); color: #fff; }
.gs-sub { font-size: clamp(18px, 3.4vw, 28px); color: #aebbc6; }
.alarm .gs-sub { color: #ffe1de; }
.gs-main button { min-height: 64px; padding: 0 40px; border-radius: 14px; font: inherit; font-size: 22px; font-weight: 700; cursor: pointer; }
.btn-clear { background: #fff; color: #7d1a14; border: 0; }
.btn-test { background: transparent; color: #5fb4d3; border: 1px solid #5fb4d3; min-height: 48px !important; font-size: 17px !important; font-weight: 500 !important; }
.gs-tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: #273642; border-top: 1px solid #273642; }
.gs-tiles div { background: #15202a; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.gs-tiles small { color: #aebbc6; font-size: 14px; }
.gs-tiles b { font-family: var(--f-display); font-weight: 700; font-size: 38px; }
.gs-note { color: #7f8e9a; font-size: 13px; padding: 10px 16px 14px; margin: 0; }
@media (max-width: 600px) { .gs-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>
</head>
<body>
<div class="gs">
  <div class="gs-head">
    <select id="ev" aria-label="Event"></select>
    <span class="gs-status"><span class="dot" id="dot"></span><span id="status">Connecting…</span></span>
  </div>

  <div class="gs-main clear" id="calm">
    <div class="big">ALL CLEAR</div>
    <div class="gs-sub" id="calmSub">Waiting for the next alarm</div>
    <button type="button" class="btn-test" id="testBtn">Show a test alarm</button>
  </div>

  <div class="gs-main alarm" id="alarm" hidden>
    <div class="big">ALARM</div>
    <div class="gs-sub" id="alarmSub"></div>
    <button type="button" class="btn-clear" id="clearBtn">Cleared · next person</button>
  </div>

  <div class="gs-tiles">
    <div><small>Gate passes</small><b id="tPass">–</b></div>
    <div><small>Alarms</small><b id="tAlarm" style="color:#f08a80">–</b></div>
    <div><small>Alarm rate</small><b id="tRate">–</b></div>
    <div><small>Alarms this hour</small><b id="tHour">–</b></div>
  </div>
  <p class="gs-note" id="note">Numbers come from the OpenGate reports in IQ Events. This screen checks for new alarms every 15 seconds. It goes fully live once CEIA approves a direct feed.</p>
</div>

<script src="/js/supabase.js"></script>
<script src="/js/app.js"></script>
<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const bar = IQ.topbar("client");
  try { await IQ.requireLogin({ staff: true, bar }); } catch { return; }

  const fmt = (n) => Number(n || 0).toLocaleString("en-US");
  const clock = (t) => new Date(t).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  let eventId = new URLSearchParams(location.search).get("event");
  let lastAlarms = null, lastSeries = [];

  function showAlarm(text) {
    $("alarmSub").textContent = text;
    $("calm").hidden = true; $("alarm").hidden = false;
    // Restart the flashing each time.
    const a = $("alarm"); a.style.animation = "none"; void a.offsetWidth; a.style.animation = "";
    try { navigator.vibrate && navigator.vibrate([400, 200, 400]); } catch {}
  }
  $("clearBtn").addEventListener("click", () => { $("alarm").hidden = true; $("calm").hidden = false; });
  $("testBtn").addEventListener("click", () => showAlarm("Test alarm · " + clock(Date.now())));
  $("ev").addEventListener("change", (e) => { eventId = e.target.value; lastAlarms = null; load(); });

  // Keep the tablet screen on while this page is open.
  let lock = null;
  async function keepAwake() { try { if ("wakeLock" in navigator && !lock) { lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release", () => (lock = null)); } } catch {} }

  async function load() {
    try {
      const view = await IQ.rpc("web_client_view", { p_event_id: eventId });
      eventId = (view.event && view.event.id) || null;
      const sel = $("ev");
      sel.replaceChildren(...(view.events || []).map((e) => { const o = document.createElement("option"); o.value = e.id; o.textContent = e.name; o.selected = e.id === eventId; return o; }));
      history.replaceState(null, "", eventId ? "?event=" + eventId : location.pathname);
      const g = eventId ? await IQ.rpc("web_gate_readings", { p_event_id: eventId }) : null;
      const cps = (g && g.checkpoints) || [], series = (g && g.series) || [];
      const pass = cps.reduce((s, c) => s + Number(c.transits || 0), 0);
      const alarms = cps.reduce((s, c) => s + Number(c.alarms || 0), 0);
      const now = series.length ? series[series.length - 1] : null;
      $("tPass").textContent = cps.length ? fmt(pass) : "–";
      $("tAlarm").textContent = cps.length ? fmt(alarms) : "–";
      $("tRate").textContent = pass ? Math.round((alarms / pass) * 1000) / 10 + "%" : "–";
      $("tHour").textContent = now ? fmt(now.alarms) : "–";
      // New alarms since the last check: find which time slot they landed in.
      if (lastAlarms !== null && alarms > lastAlarms) {
        const n = alarms - lastAlarms;
        const prev = new Map(lastSeries.map((s) => [s.t, Number(s.alarms || 0)]));
        const hit = [...series].reverse().find((s) => Number(s.alarms || 0) > (prev.get(s.t) || 0)) || now;
        const where = cps.length === 1 ? cps[0].name : "";
        showAlarm((n === 1 ? "1 new alarm" : n + " new alarms") + (where ? " · " + where : "") + (hit ? " · " + clock(hit.t) : ""));
      }
      lastAlarms = alarms; lastSeries = series;
      $("dot").className = "dot ok";
      $("status").textContent = cps.length ? (cps.map((c) => c.name).join(", ") + " · checked " + clock(Date.now())) : "No gate numbers for this event yet";
      $("calmSub").textContent = alarms ? "Last alarm logged " + (series.filter((s) => Number(s.alarms) > 0).map((s) => clock(s.t)).pop() || "") : "Waiting for the next alarm";
    } catch (e) {
      $("dot").className = "dot bad";
      $("status").textContent = IQ.explain(e);
    }
  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { keepAwake(); load(); } });
  document.addEventListener("click", keepAwake, { once: true });
  keepAwake();
  await load();
  setInterval(() => { if (!document.hidden) load(); }, 15000);
})();
</script>
</body>
</html>
