<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IQ Equipment Stickers</title>
<meta name="description" content="Printable QR stickers for equipment sign-out.">
<meta name="theme-color" content="#0d5f7a">
<link rel="icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/css/common.css">
<link rel="stylesheet" href="/css/gear.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
main { max-width: 900px; }
.sheet { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; margin-top: 16px; }
.sticker { background: #fff; color: #12202b; border: 1px dashed #b9c4cc; border-radius: 10px; padding: 12px 12px 10px; display: grid; justify-items: center; gap: 2px; break-inside: avoid; }
.sticker .k { font-family: var(--f-display); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; font-size: 13px; color: #0d5f7a; }
.sticker svg { width: 100%; max-width: 180px; height: auto; }
.sticker b { font-family: var(--f-display); font-size: 34px; letter-spacing: .04em; line-height: 1; }
.sticker small { font-size: 11px; color: #4a5864; text-align: center; }
@media print {
  .iq-bar, .noprint { display: none !important; }
  body { background: #fff; }
  main { padding: 0; max-width: none; }
  .sheet { grid-template-columns: repeat(3, 1fr); gap: 0.25in; margin: 0; }
}
</style>
</head>
<body>
<main>
  <div class="noprint">
    <h1>Equipment QR stickers</h1>
    <p class="sub">One sticker per unit. Scanning it with a phone camera opens that unit's sign-out / return page (after signing in once on that phone).</p>
    <div class="links"><button class="primary" type="button" onclick="print()">Print</button> <a class="link" href="/gear">Back to equipment</a></div>
  </div>
  <div class="sheet" id="sheet"></div>
  <p class="msg bad" id="err"></p>
</main>
<script src="/js/supabase.js"></script>
<script src="/js/qrcode.js"></script>
<script src="/js/app.js"></script>
<script>
(async () => {
  const bar = IQ.topbar("gear");
  try { await IQ.requireLogin({ staff: true, bar }); } catch { return; }
  let data;
  try { data = await IQ.rpc("web_gear_list"); } catch (e) { document.getElementById("err").textContent = IQ.explain(e); return; }
  document.getElementById("sheet").replaceChildren(...data.items.map((it) => {
    const url = location.origin + "/g/" + encodeURIComponent(it.code);
    const qr = qrcode(0, "M"); qr.addData(url); qr.make();
    const d = document.createElement("div"); d.className = "sticker";
    d.innerHTML = "<span class=k></span>" + qr.createSvgTag({ cellSize: 6, margin: 2, scalable: true }) + "<b></b><small>Scan to sign out or return</small>";
    d.querySelector(".k").textContent = (it.kind === "OpenGate" ? "CEIA " : "") + it.kind + " · Stapleton";
    d.querySelector("b").textContent = it.serial;
    return d;
  }));
})();
</script>
</body>
</html>
