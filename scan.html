<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IQ Equipment Scan</title>
<meta name="description" content="Sign a piece of equipment out or back in by scanning its QR sticker.">
<meta name="theme-color" content="#0d5f7a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stapleton IQ">
<link rel="stylesheet" href="/css/common.css">
<link rel="stylesheet" href="/css/gear.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
</head>
<body>
<main>
  <h1 id="title">Equipment</h1>
  <p class="sub" id="kind">&nbsp;</p>
  <div id="banner" class="banner" hidden></div>

  <form id="form" class="panel" hidden novalidate>
    <h2 id="formTitle">Sign out</h2>
    <label class="f">Event
      <select name="evsel"></select>
    </label>
    <label class="f" id="evOtherBox" hidden>Event or job name (not in the list)
      <input type="text" name="evother" autocomplete="off" maxlength="200" placeholder="e.g. Smith wedding, Miami Beach">
    </label>
    <label class="f">Location
      <input type="text" name="location" autocomplete="off" maxlength="200" placeholder="Where the gates are going, e.g. Hall B, main entrance">
    </label>
    <div class="two">
      <label class="f">Date out<input type="date" name="dateout"></label>
      <label class="f"><span id="backLbl">Date back</span><input type="date" name="dateback"></label>
    </div>
    <label class="f"><span id="batLbl">Batteries taken</span>
      <span class="stepper"><button type="button" data-d="-1" aria-label="One less">−</button><input type="number" name="batteries" inputmode="numeric" min="0" max="500" value="0"><button type="button" data-d="1" aria-label="One more">+</button></span>
    </label>
    <div class="f" style="margin-top:12px"><span id="extLbl" class="flbl">Also taking</span>
      <div class="extras" id="extras"></div>
    </div>
    <label class="f" id="nameBox" hidden>Your full name (asked once, then it's signed for you every time)
      <input type="text" name="fullname" autocomplete="name" maxlength="80" placeholder="e.g. Joe Cooney">
    </label>
    <div class="who"><span id="whoLbl">Taken out by</span><b id="whoName"></b></div>
    <h2 style="margin-top:16px" id="itemsTitle">Units</h2>
    <div class="items" id="items"></div>
    <p class="msg" id="msg" role="status"></p>
    <button class="primary big" type="submit" id="go" style="margin-top:14px">Sign out</button>
  </form>

  <div id="done" class="panel" hidden>
    <h2>Saved</h2>
    <p id="doneTxt" style="margin:0;font-size:17px;line-height:1.4"></p>
    <div class="links">
      <a class="link" id="sheetLink" href="#">Sign-out sheet for this event (print or save as PDF)</a>
      <a class="link" href="/gear">All equipment</a>
    </div>
  </div>
  <div class="links" id="sopLinkBox" hidden><a class="link" href="#" id="sopLink">Read the SOP</a></div>

  <div class="panel" id="histPanel" hidden>
    <h2 id="histTitle">History for this unit</h2>
    <ul class="hist" id="hist"></ul>
  </div>
  <p class="msg bad" id="err"></p>
</main>
<script src="/js/supabase.js"></script>
<script src="/js/app.js"></script>
<script src="/js/gear.js"></script>
<script src="/js/sop.js"></script>
<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const bar = IQ.topbar("gear");
  try { await IQ.requireLogin({ field: true, bar }); } catch { return; }
  const code = decodeURIComponent((location.pathname.match(/^\/g\/([^/]+)/) || [])[1] || new URLSearchParams(location.search).get("code") || "");
  if (!code) { location.replace("/gear"); return; }
  const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
  const OTHER = "__other__";

  let data;
  async function load() {
    try { data = await IQ.rpc("web_gear_item", { p_code: code }); }
    catch (e) { $("err").textContent = /unknown_item/.test(e.message) ? "This sticker isn't in the system (" + code + "). Ask Joe to add it." : IQ.explain(e); return false; }
    return true;
  }
  if (!(await load())) return;
  draw();

  function banner() {
    const it = data.item, out = it.state === "out", b = $("banner"), lo = data.last_out || {};
    b.hidden = false;
    b.className = "banner " + (it.flag_damaged ? "dmg" : out ? "out" : "in");
    b.innerHTML = out
      ? `<b>Gate ${"<span data-t=s></span>"} is signed out</b>To <span data-t="ev"></span>${lo.location ? " (<span data-t=loc></span>)" : ""} by <span data-t="by"></span>, ${GEAR.when(it.at)}.`
      : `<b>Gate <span data-t=s></span> is in storage</b>${it.at ? "Returned by <span data-t=by></span>, " + GEAR.when(it.at) + "." : "Not signed out yet."}`;
    GEAR.fill(b, { s: it.serial, ev: it.event_name, by: it.by_name, loc: lo.location });
    if (it.flag_damaged) {
      const p = document.createElement("div"); p.style.marginTop = "6px"; p.style.color = "var(--bad)"; p.style.fontWeight = "600";
      p.textContent = "Reported damaged" + (it.note ? ": " + it.note : ". See history below.");
      b.appendChild(p);
    }
  }

  function draw() {
    const it = data.item, out = it.state === "out", lo = data.last_out || {};
    document.title = (out ? "Return " : "Sign out ") + it.kind + "s · Stapleton IQ";
    $("title").textContent = (out ? "Return " : "Sign out ") + it.kind + "s";
    $("kind").textContent = "You scanned gate " + it.serial + ". Tick any other gates below that go with it.";
    $("histTitle").textContent = "History for gate " + it.serial;
    banner();

    const action = out ? "back" : "out";
    const f = $("form"); f.hidden = false;
    $("formTitle").textContent = out ? "Return" : "Sign out";
    $("go").textContent = out ? "Return" : "Sign out";
    $("whoLbl").textContent = out ? "Returned by" : "Taken out by";
    $("whoName").textContent = data.needs_name ? "(your name)" : (data.my_name || "you");
    $("nameBox").hidden = !data.needs_name;
    f.fullname.oninput = () => { $("whoName").textContent = f.fullname.value.trim() || "(your name)"; };

    // Event: IQ events, then names typed before, then "Not listed".
    const names = [];
    data.events.forEach((e) => { if (!names.includes(e.name)) names.push(e.name); });
    data.event_names.forEach((n) => { if (!names.includes(n)) names.push(n); });
    const sel = f.evsel;
    sel.replaceChildren(Object.assign(document.createElement("option"), { value: "", textContent: "Pick the event…" }),
      ...names.map((n) => Object.assign(document.createElement("option"), { value: n, textContent: n })),
      Object.assign(document.createElement("option"), { value: OTHER, textContent: "Not listed: type it in" }));
    const start = out ? (it.event_name || "") : (data.suggested_event || "");
    if (start && !names.includes(start)) { sel.value = OTHER; f.evother.value = start; } else sel.value = start;
    const venueOf = (n) => (data.events.find((e) => e.name === n) || {}).venue || "";
    const syncEv = () => { $("evOtherBox").hidden = sel.value !== OTHER; };
    sel.onchange = () => { syncEv(); if (sel.value === OTHER) f.evother.focus(); else if (!f.location.dataset.typed) f.location.value = venueOf(sel.value); };
    syncEv();
    f.location.oninput = () => { f.location.dataset.typed = "1"; };
    f.location.value = out ? (lo.location || "") : venueOf(sel.value);

    // Dates and batteries
    f.dateout.value = out ? (lo.date_out || "") : today();
    f.dateback.value = out ? today() : "";
    f.dateout.disabled = out;
    $("backLbl").textContent = out ? "Date back" : "Date back (expected, if you know it)";
    $("batLbl").textContent = out ? "Batteries returned" + (lo.batteries != null ? " (" + lo.batteries + " went out)" : "") : "Batteries taken";
    f.batteries.value = out ? (lo.batteries != null ? lo.batteries : 0) : 0;
    // Other gear on this sheet: a 0-10 counter for each. On return, it starts at what went out.
    const wentOut = GEAR.xmap(lo.extras);
    const wentTxt = GEAR.xtext(lo.extras);
    $("extLbl").textContent = out ? "Also coming back" + (wentTxt ? " (went out: " + wentTxt + ")" : "") : "Also taking";
    $("extras").replaceChildren(...GEAR.EXTRAS.map((name) => {
      const r = document.createElement("div"); r.className = "xrow";
      r.innerHTML = '<span class="xname"></span><span class="qty"><button type="button" data-d="-1" aria-label="One less">−</button><b>0</b><button type="button" data-d="1" aria-label="One more">+</button></span>';
      r.querySelector(".xname").textContent = name; r.dataset.name = name;
      const v = r.querySelector("b"), set = (n) => { n = Math.max(0, Math.min(10, n)); v.textContent = n; r.dataset.qty = n; r.classList.toggle("on", n > 0); };
      set(out ? (wentOut[name] || 0) : (GEAR.EXTRA_MIN[name] || 0));
      r.querySelectorAll("button").forEach((bt) => (bt.onclick = () => set(Number(r.dataset.qty) + Number(bt.dataset.d))));
      return r;
    }));
    f.querySelectorAll(".stepper button").forEach((b) => (b.onclick = () => {
      f.batteries.value = Math.max(0, Math.min(500, (parseInt(f.batteries.value, 10) || 0) + Number(b.dataset.d)));
    }));

    $("itemsTitle").textContent = out ? "Gates coming back" : "Gates going out";
    const others = data.same_kind.map((o) => ({ ...o, usable: (o.state === "out") === out }));
    others.sort((a, c) => (c.usable - a.usable) || ((c.event_name === it.event_name) - (a.event_name === it.event_name)));
    const rows = [GEAR.row({ ...it, usable: true }, true, false, "The one you scanned")].concat(others.map((o) =>
      GEAR.row(o, false, !o.usable, o.usable ? null : (o.state === "out" ? "Already out: " + (o.event_name || "") + ", " + (o.by_name || "") : "Already in storage"))));
    $("items").replaceChildren(...rows.map((r) => r.el));

    f.onsubmit = async (e) => {
      e.preventDefault();
      const msg = $("msg"); msg.className = "msg"; msg.textContent = "";
      const bad = (t, el) => { msg.className = "msg bad"; msg.textContent = t; if (el) el.focus(); };
      const ev = sel.value === OTHER ? f.evother.value.trim() : sel.value;
      if (!ev) return bad(sel.value === OTHER ? "Type the event or job name." : "Pick the event (or choose “Not listed” and type it in).", sel.value === OTHER ? f.evother : sel);
      const picked = rows.filter((r) => r.checked());
      if (!picked.length) return bad("Tick at least one gate.");
      if (picked.find((r) => r.value().condition === "damaged" && !r.value().note && !r.value().photo_b64)) return bad("Say what's wrong (or add a photo) for each damaged gate.");
      if (f.dateout.value && f.dateback.value && f.dateback.value < f.dateout.value) return bad("Date back can't be before date out.", f.dateback);
      const fullname = data.needs_name ? f.fullname.value.trim() : "";
      if (data.needs_name && fullname.length < 2) return bad("Type your full name first. You only do this once.", f.fullname);
      const batteries = parseInt(f.batteries.value, 10);
      const sop = action === "out" && window.GEAR_SOP && GEAR_SOP[it.kind];
      if (sop && !(await showSop(it.kind, true))) return bad("Tick “I’ve read and understand the SOP” to sign out.");
      $("go").disabled = true; $("go").textContent = "Saving…";
      try {
        if (fullname) { await IQ.rpc("web_set_my_name", { p_name: fullname }); data.needs_name = false; $("nameBox").hidden = true; }
        const extras = [...$("extras").querySelectorAll(".xrow")].map((r) => ({ name: r.dataset.name, qty: Number(r.dataset.qty) })).filter((x) => x.qty > 0);
        const res = await IQ.rpc("web_gear_save", { p: {
          action, event_name: ev, location: f.location.value.trim(), batteries: isNaN(batteries) ? null : batteries, extras,
          date_out: f.dateout.value || null, date_back: f.dateback.value || null, sop_read: sop ? sop.version : null, items: picked.map((r) => r.value()) } });
        const dmg = picked.filter((r) => r.value().condition === "damaged").length;
        $("doneTxt").textContent = `${picked.length} ${it.kind}${picked.length > 1 ? "s" : ""} (${picked.map((r) => r.serial).join(", ")}) ` +
          `${action === "out" ? "signed out to" : "returned from"} ${ev}` + (isNaN(batteries) || !batteries ? "" : `, ${batteries} batter${batteries === 1 ? "y" : "ies"}`) + (extras.length ? ", plus " + GEAR.xtext(extras).toLowerCase() : "") +
          `, by ${res.by_name}.` + (dmg ? ` ${dmg} marked damaged.` : "");
        $("sheetLink").href = "/gear-sheet?event=" + encodeURIComponent(ev);
        $("done").hidden = false; f.hidden = true;
        await load(); banner(); history();
      } catch (err) {
        bad(/back_before_out/.test(err.message) ? "Date back can't be before date out." : /bad_date/.test(err.message) ? "Check the dates." : IQ.explain(err));
      } finally { $("go").disabled = false; $("go").textContent = out ? "Return" : "Sign out"; }
    };
    // SOP: link always there; on sign-out it pops up and must be ticked before saving.
    const hasSop = !!(window.GEAR_SOP && GEAR_SOP[it.kind]);
    $("sopLinkBox").hidden = !hasSop;
    $("sopLink").textContent = "Read the " + it.kind + " SOP";
    $("sopLink").onclick = (e) => { e.preventDefault(); showSop(it.kind, false); };
    history();
  }

  function history() {
    $("histPanel").hidden = false;
    GEAR.history($("hist"), data.history, false);
  }
})();
</script>
</body>
</html>
